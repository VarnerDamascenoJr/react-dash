name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check documentation links
        run: npm run check:docs

      - name: Check frontend style units
        run: npm run check:style-units

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npm run test:e2e:install -- --with-deps

      - name: Browser tests
        run: npm run test:e2e -- --workers=1

      - name: Retain browser failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
